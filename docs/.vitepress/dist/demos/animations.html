<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e1e2e;display:flex;align-items:center;justify-content:center;height:100vh;gap:24px;font-family:sans-serif;color:#fff;cursor:pointer;user-select:none}
.box{width:100px;height:100px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;text-align:center;line-height:1.3}
#msg{position:absolute;bottom:16px;font-size:12px;color:rgba(255,255,255,0.4)}
</style></head><body>
<div class="box" id="b1" style="background:#6366f1">Fade Up</div>
<div class="box" id="b2" style="background:#ec4899">Zoom In</div>
<div class="box" id="b3" style="background:#f59e0b">Flip X</div>
<div class="box" id="b4" style="background:#10b981">Slide Left</div>
<div id="msg">Click to replay</div>
<script>
// The same Web Animations presets presented decks use
var OUT2="cubic-bezier(0.25, 0.46, 0.45, 0.94)",OUT3="cubic-bezier(0.215, 0.61, 0.355, 1)",BACK="cubic-bezier(0.175, 0.885, 0.32, 1.275)";
var BOXES=[
  ["b1",OUT3,[{opacity:0,translate:"0 48px"}],0],
  ["b2",BACK,[{opacity:0,scale:"0.7"}],150],
  ["b3",OUT2,[{opacity:0,transform:"perspective(600px) rotateX(90deg)"},{transform:"perspective(600px) rotateX(0deg)"}],300],
  ["b4",OUT3,[{translate:"200px 0"}],450]
];
function run(){
  BOXES.forEach(function(b){
    var el=document.getElementById(b[0]);
    if(el._entry)el._entry.cancel();
    var frames=b[2].slice();
    frames[0]=Object.assign({offset:0},frames[0]);
    el._entry=el.animate(frames,{duration:600,delay:b[3],easing:b[1],fill:"backwards"});
  });
}
run();
document.addEventListener("click",run);
</script></body></html>
