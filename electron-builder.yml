appId: com.parallax.app
productName: Parallax
directories:
  output: dist-electron
  # The icon (icon.png, drawn from icon.svg; icons/ holds it at each size an
  # icon theme looks for) and the Linux install scripts
  buildResources: build

# Electron takes the app's name from package.json: "Parallax", so its windows
# match the desktop entry (StartupWMClass, and Wayland's app id) and show the
# icon. Where it keeps presentations is set apart from the name, in main.js.
extraMetadata:
  productName: Parallax
  desktopName: parallax.desktop

files:
  - electron/**/*
  - "!node_modules"

extraResources:
  - from: server/
    to: server/
  - from: client/dist/
    to: client/dist/

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip

win:
  target:
    - nsis

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Office
  executableName: parallax
  icon: build/icons
  synopsis: Interactive and intuitive slides for complex concepts
  description: >-
    Parallax is a slide editor. Put live graphs, physics and circuit diagrams,
    equations and 3D molecules on a slide, and move them while you present.

# Chromium's sandbox is on everywhere: a deck runs its author's code. The .deb
# and .rpm install what the sandbox needs (an AppArmor profile on Ubuntu 24.04
# and later), so they're the packages to use there; the AppImage can't.
deb:
  # The package is "parallax" on every channel, whatever package.json names it
  packageName: parallax
  artifactName: parallax_${version}_${arch}.${ext}
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
  # electron-builder's list, plus ALSA, which Electron won't start without
  # (a desktop has it already; a minimal system may not). Ubuntu 24.04 calls
  # it libasound2t64; there "libasound2" alone can install an OSS stand-in
  # that Electron can't use, so the real one is named first.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
  # The desktop app's package was "revealjs-editor" through 1.0.0
  fpm:
    - --replaces=revealjs-editor
    - --conflicts=revealjs-editor

rpm:
  packageName: parallax
  artifactName: parallax-${version}.${arch}.${ext}
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
  # The libraries the app links to (readelf -d), as rpm names them whatever
  # package has them, so Fedora, RHEL and openSUSE all resolve them; glibc's
  # and the bundled libffmpeg are left out. xdg-utils opens links.
  depends:
    - libasound.so.2()(64bit)
    - libatk-1.0.so.0()(64bit)
    - libatk-bridge-2.0.so.0()(64bit)
    - libatspi.so.0()(64bit)
    - libcairo.so.2()(64bit)
    - libcups.so.2()(64bit)
    - libdbus-1.so.3()(64bit)
    - libdrm.so.2()(64bit)
    - libexpat.so.1()(64bit)
    - libgbm.so.1()(64bit)
    - libgio-2.0.so.0()(64bit)
    - libglib-2.0.so.0()(64bit)
    - libgobject-2.0.so.0()(64bit)
    - libgtk-3.so.0()(64bit)
    - libnspr4.so()(64bit)
    - libnss3.so()(64bit)
    - libnssutil3.so()(64bit)
    - libpango-1.0.so.0()(64bit)
    - libsmime3.so()(64bit)
    - libudev.so.1()(64bit)
    - libX11.so.6()(64bit)
    - libxcb.so.1()(64bit)
    - libXcomposite.so.1()(64bit)
    - libXdamage.so.1()(64bit)
    - libXext.so.6()(64bit)
    - libXfixes.so.3()(64bit)
    - libxkbcommon.so.0()(64bit)
    - libXrandr.so.2()(64bit)
    - xdg-utils

appImage:
  artifactName: Parallax-${version}-${arch}.${ext}
