# Self-hosted Parallax: `docker compose up -d`, then open http://localhost:3002.
# One editor with no accounts, built from this checkout; presentations and
# uploads are kept in the two Docker volumes below.
#
# parallax-presentations.com itself runs from docker-compose.server.yml.

services:
  parallax:
    build: .
    ports:
      # Only this computer can open it, since self-hosted mode has no sign-in.
      # To open it to your network too, use "3002:3002" and list the names
      # people will use to reach it below (docs/guide/installation.md).
      - "127.0.0.1:3002:3002"
    # environment:
    #   - PARALLAX_ALLOWED_HOSTS=localhost,192.168.1.20
    volumes:
      - parallax-data:/app/server/data
      - parallax-uploads:/app/server/uploads
    restart: unless-stopped

volumes:
  parallax-data:
    name: parallax-selfhosted-data
  parallax-uploads:
    name: parallax-selfhosted-uploads
