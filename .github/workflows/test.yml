name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    # dev too, for Dependabot's library updates (.github/dependabot.yml)
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        working-directory: client
        run: npx vitest run

      - name: Syntax check server
        run: node --check server/index.js

      # The tests that need Postgres skip without TEST_DATABASE_URL
      - name: Run server tests
        run: node --test --test-force-exit server/test/*.test.js
