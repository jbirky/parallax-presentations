<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The server puts each page's own title, description and preview tags
         between these marks (server/services/site-pages.js) -->
    <!-- meta -->
    <title>Parallax</title>
    <meta name="description" content="Parallax is a slide editor that runs in your browser. Put live graphs, physics and circuit diagrams, equations and 3D molecules on a slide, and move them while you present. Free to start, open source." />
    <!-- /meta -->
    <meta name="theme-color" content="#0f0f17" />
    <!-- A theme someone chose (utils/theme.js), before the app's script runs,
         so the page doesn't show the other one first: the hosted site's
         landing page has its own; the self-hosted app still takes the old key -->
    <script>try { var cloud = '%VITE_PARALLAX_MODE%' === 'cloud', site = cloud && (location.pathname === '/' || location.pathname === ''); var ok = function (v) { return v === 'light' || v === 'dark' ? v : null }; var t = ok(localStorage.getItem(site ? 'parallax-site-theme' : 'parallax-app-theme')); if (!t && !cloud) t = ok(localStorage.getItem('parallax-theme')) || (localStorage.getItem('editor-theme') === 'light' ? 'light' : null); if (t) document.documentElement.setAttribute('data-theme', t) } catch (e) {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
