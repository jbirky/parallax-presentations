# dev.parallax-presentations.com on epyc: dev (parallax-dev, from dev) in
# cloud mode, plus the Umami analytics it reports to. Prod runs on its own
# server, from docker-compose.prod.yml. Needs epyc's .env, whose COMPOSE_FILE
# line makes plain `docker compose` use this file. Self-hosting uses
# docker-compose.yml instead.
#
# The project name is pinned because the dev and Umami volumes are named
# after it.
name: parallax-presentations

services:
  parallax-dev:
    build:
      context: https://github.com/jbirky/parallax-presentations.git#dev
      args:
        - VITE_PARALLAX_MODE=cloud
        - VITE_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
    ports:
      - "127.0.0.1:3003:3002"
    volumes:
      - parallax-dev-data:/app/server/data
      - parallax-dev-uploads:/app/server/uploads
    env_file:
      - .env
    environment:
      - PARALLAX_MODE=cloud
      - PARALLAX_DB=postgres
      - PARALLAX_STORAGE=r2
      - PARALLAX_LIVE_DATASETS=on
      - NODE_ENV=production
      # Its own site: prod doesn't trust dev's pages or sign-ins, nor dev prod's
      - PARALLAX_PUBLIC_URL=https://dev.parallax-presentations.com
      # Its own website in Umami, apart from prod's
      - UMAMI_URL=http://umami:3000
      - UMAMI_WEBSITE_ID=3f816c73-39d2-40d7-86bb-1117e33777cb
      # Kept out of search engines, which should only find prod
      - PARALLAX_NOINDEX=1
      # Own database and bucket so dev can never touch prod data
      - DATABASE_URL=${DEV_DATABASE_URL:?set DEV_DATABASE_URL in .env}
      - R2_BUCKET=parallax-uploads-dev
      - R2_ACCESS_KEY=${DEV_R2_ACCESS_KEY:?set DEV_R2_ACCESS_KEY in .env}
      - R2_SECRET_KEY=${DEV_R2_SECRET_KEY:?set DEV_R2_SECRET_KEY in .env}
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - "127.0.0.1:3004:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-replace-me-with-a-random-string}
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped

  umami-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  parallax-dev-data:
  parallax-dev-uploads:
  umami-db-data:
